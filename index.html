<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			
			padding: 24px;
			color: #183153;
			background: linear-gradient(135deg, #eaf4ff, #f4edff);
			font-family: system-ui, sans-serif;
			text-align: center;
		}
		main {
			max-width: 560px;
			padding: 48px 36px;
			background: #fff;
			border-radius: 20px;
			box-shadow: 0 16px 48px #1831531a;
		}
		h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); }
		p { margin: 0 0 28px; color: #5f6f83; line-height: 1.6; }
		a {
			display: inline-block;
			padding: 12px 22px;
			color: #fff;
			background: #3867e8;
			border-radius: 999px;
			text-decoration: none;
			font-weight: 600;
		}
		a:hover { background: #274fc0; }
	</style>
</head>
<body>
	<main>
		<h1>Hello, world!</h1>
		<p>A simple little site to get you started. Make yourself at home.</p>
		<a href="mailto:hello@example.com">Say hello</a>
	</main>
</body>
</html>
